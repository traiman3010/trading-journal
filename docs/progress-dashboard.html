<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Dashboard — Fullstack Journey</title>
<style>
  :root {
    --bg: #f5f4ef; --surface: #ffffff; --surface-2: #f1efe8;
    --border: rgba(0,0,0,0.1); --border-strong: rgba(0,0,0,0.18);
    --text: #2c2c2a; --text-2: #5f5e5a; --text-3: #8a8980;
    --info: #185fa5; --info-bg: #e6f1fb; --success: #0f6e56; --success-bg: #e1f5ee;
    --warning: #854f0b; --radius: 8px; --radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1e1c; --surface: #2a2927; --surface-2: #323230;
      --border: rgba(255,255,255,0.12); --border-strong: rgba(255,255,255,0.2);
      --text: #ecebe5; --text-2: #b4b2a9; --text-3: #888780;
      --info: #85b7eb; --info-bg: #0c447c; --success: #5dcaa5; --success-bg: #085041; --warning: #f0c674;
    }
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Sarabun", sans-serif; background: var(--bg); color: var(--text); margin: 0; line-height: 1.6; padding: 0 0 4rem; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 1.5rem; }
  header.hero { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 2rem 0; margin-bottom: 1.5rem; }
  header.hero h1 { font-size: 24px; font-weight: 500; margin: 0 0 6px; }
  header.hero p { color: var(--text-2); margin: 0; font-size: 14px; }
  .overall { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; }
  .overall h2 { font-size: 15px; font-weight: 500; margin: 0 0 12px; }
  .bar { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--info); border-radius: 5px; transition: width 0.4s ease; }
  .bar-sm { height: 6px; }
  .tier { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem 1.5rem; margin-bottom: 1rem; }
  .tier-head { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .tier-title { font-size: 16px; font-weight: 500; }
  .tier-pct { font-size: 13px; color: var(--text-2); }
  .sprint { margin-top: 1rem; padding-top: 1rem; border-top: 0.5px solid var(--border); }
  .sprint-name { font-size: 14px; font-weight: 500; margin: 0 0 4px; }
  .sprint-goal { font-size: 13px; color: var(--text-2); margin: 0 0 10px; }
  .task { display: flex; align-items: flex-start; gap: 10px; padding: 5px 0; font-size: 13px; }
  .task input { margin-top: 4px; cursor: pointer; flex-shrink: 0; }
  .task label { cursor: pointer; }
  .task.done label { text-decoration: line-through; color: var(--text-3); }
  .muted { color: var(--text-3); font-size: 13px; font-style: italic; }
  .legend { font-size: 13px; color: var(--text-2); margin-top: 6px; }
  .reset { font-size: 12px; color: var(--text-3); background: none; border: 0.5px solid var(--border-strong); border-radius: var(--radius); padding: 4px 10px; cursor: pointer; margin-top: 1.5rem; }
  .pct-big { font-size: 28px; font-weight: 500; }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1>📊 Progress Dashboard</h1>
    <p>เส้นทางสู่ fullstack · ติ๊ก task แล้ว progress จะบันทึกอัตโนมัติ (ในเบราว์เซอร์นี้)</p>
  </div>
</header>

<div class="wrap">
  <div class="overall">
    <h2>ความก้าวหน้าทั้งหมด</h2>
    <div class="flex" style="display:flex;align-items:center;gap:16px;">
      <span class="pct-big" id="overallPct">0%</span>
      <div style="flex:1;"><div class="bar"><div id="overallBar" style="width:0%;"></div></div></div>
    </div>
    <p class="legend" id="overallText">เริ่มต้นเลย — ติ๊ก task แรกใน Sprint 1</p>
  </div>

  <div id="tiers"></div>

  <button class="reset" onclick="resetAll()">รีเซ็ตทั้งหมด</button>
</div>

<script>
const DATA = [
  { id: 't1', title: 'Tier 1 · พื้นฐาน', sprints: [
    { name: 'Sprint 1 — Setup + Auth', goal: 'ตั้งโปรเจกต์ + auth ใช้งานได้', tasks: [
      'ตั้งโปรเจกต์ Next.js + TypeScript','ตั้ง Prisma + เชื่อม Postgres','สร้าง schema + run migration',
      'เข้าใจ migration (อธิบายได้)','register/login/logout ด้วย Auth.js','protect route',
      'เข้าใจ session/token/hashing','commit + push'] },
    { name: 'Sprint 2 — Trade CRUD', goal: 'CRUD การเทรด + คำนวณ P&L', tasks: [
      'API + UI สร้างการเทรด','Zod validation ฝั่ง server','คำนวณ P&L ฝั่ง backend',
      'แก้/ลบ เฉพาะของตัวเอง','เข้าใจทำไม validate ฝั่ง server','commit สม่ำเสมอ'] },
    { name: 'Sprint 3 — Stats + Dashboard', goal: 'aggregation + กราฟ', tasks: [
      'aggregation query (win rate, P&L, R:R)','หน้า dashboard + การ์ดสถิติ','กราฟ Recharts',
      'เข้าใจ N+1 problem','commit'] },
    { name: 'Sprint 4 — Filter + Deploy', goal: 'ปิดงาน project 1', tasks: [
      'ค้นหา/กรอง + pagination','จัดการ error + edge case','deploy Vercel + Neon',
      'เขียน test P&L + stats','README + diagram + decision log','✅ Project 1 เสร็จ'] },
    { name: 'Sprint 5-7 — Portfolio Tracker', goal: 'external API + caching', tasks: [
      'Holdings CRUD','External API + Caching layer','Portfolio summary + chart','Deploy + README','✅ Project 2 เสร็จ'] },
    { name: 'Sprint 8-10 — Price Alert', goal: 'background job + notification', tasks: [
      'Alert CRUD','Background job เช็คราคา','Notification + idempotency','Deploy + README','✅ Project 3 เสร็จ'] },
  ]},
  { id: 't2', title: 'Tier 2 · ระดับงานจริง', sprints: [
    { name: 'Realtime Kanban', goal: 'WebSocket realtime sync', tasks: [
      'board/column/card CRUD','WebSocket layer + broadcast','drag-drop + optimistic update',
      'conflict + reconnect','presence + deploy','✅ Project 4 เสร็จ'] },
    { name: 'E-commerce', goal: 'transaction + race condition', tasks: [
      'Product CRUD + role','Cart','Order + transaction (atomic)','แก้ race condition + test','deploy','✅ Project 5 เสร็จ'] },
  ]},
  { id: 't3', title: 'Tier 3 · Production-grade', sprints: [
    { name: 'ยกระดับ 1 project', goal: 'production-ready', tasks: [
      'Docker + compose','CI/CD pipeline','Redis cache','queue (background jobs)',
      'logging + monitoring','security hardening','testing ครบระดับ','performance tuning'] },
  ]},
  { id: 't4', title: 'Tier 4 · Specialization', sprints: [
    { name: 'เลือกทางลึก', goal: 'ขอ Claude เขียน TOR เต็มตอนถึง', tasks: [
      'เลือกทาง (trading bot / system design / devops / AI)','ขอ TOR เต็มจาก Claude','ทำ project','✅ portfolio สมบูรณ์'] },
  ]},
];

const KEY = 'fullstack-progress-v1';
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { state = {}; }

function taskId(ti, si, idx) { return `${DATA[ti].id}-s${si}-t${idx}`; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

function calc() {
  let total = 0, done = 0;
  DATA.forEach((tier, ti) => tier.sprints.forEach((sp, si) => sp.tasks.forEach((_, idx) => {
    total++; if (state[taskId(ti,si,idx)]) done++;
  })));
  return { total, done, pct: total ? Math.round(done/total*100) : 0 };
}

function tierPct(ti) {
  let total = 0, done = 0;
  DATA[ti].sprints.forEach((sp, si) => sp.tasks.forEach((_, idx) => {
    total++; if (state[taskId(ti,si,idx)]) done++;
  }));
  return total ? Math.round(done/total*100) : 0;
}

function render() {
  const c = calc();
  document.getElementById('overallPct').textContent = c.pct + '%';
  document.getElementById('overallBar').style.width = c.pct + '%';
  document.getElementById('overallText').textContent =
    c.done === 0 ? 'เริ่มต้นเลย — ติ๊ก task แรกใน Sprint 1'
    : c.pct === 100 ? '🎉 จบ roadmap แล้ว — คุณคือ fullstack developer!'
    : `ทำไปแล้ว ${c.done} จาก ${c.total} task · สู้ต่อ!`;

  const root = document.getElementById('tiers');
  root.innerHTML = '';
  DATA.forEach((tier, ti) => {
    const tp = tierPct(ti);
    const div = document.createElement('div');
    div.className = 'tier';
    let html = `<div class="tier-head" onclick="toggle('${tier.id}')">
      <span class="tier-title">${tier.title}</span>
      <span class="tier-pct">${tp}%</span></div>
      <div class="bar bar-sm" style="margin-top:8px;"><div style="width:${tp}%;"></div></div>
      <div id="body-${tier.id}" style="display:${ti===0?'block':'none'};">`;
    tier.sprints.forEach((sp, si) => {
      html += `<div class="sprint"><p class="sprint-name">${sp.name}</p><p class="sprint-goal">🎯 ${sp.goal}</p>`;
      sp.tasks.forEach((t, idx) => {
        const id = taskId(ti, si, idx);
        const checked = state[id] ? 'checked' : '';
        const doneClass = state[id] ? 'done' : '';
        html += `<div class="task ${doneClass}">
          <input type="checkbox" id="${id}" ${checked} onchange="check('${id}')">
          <label for="${id}">${t}</label></div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
    div.innerHTML = html;
    root.appendChild(div);
  });
}

function check(id) { state[id] = !state[id]; if(!state[id]) delete state[id]; save(); render(); }
function toggle(tid) { const b = document.getElementById('body-'+tid); b.style.display = b.style.display==='none'?'block':'none'; }
function resetAll() { if(confirm('รีเซ็ต progress ทั้งหมด?')) { state = {}; save(); render(); } }

render();
</script>
</body>
</html>
